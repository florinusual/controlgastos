<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Control de gastos</title>
<meta name="description" content="Tarjetas de crédito por corte y quincena, movimientos y lista del súper.">
<meta name="theme-color" content="#0D120F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Gastos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="top"><span class="brand"><i aria-hidden="true"></i>Control de gastos</span><span class="who" id="who"></span></header>
<main id="view"><div class="empty"><b>Cargando…</b></div></main>
<button id="fab" class="btn primary fab" data-act="addCard" hidden>+ Tarjeta</button>
<nav id="tabs" aria-label="Secciones">
  <button data-tab="tarjetas"><svg viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h4"/></svg>Tarjetas</button>
  <button data-tab="quincenas"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h3"/></svg>Quincenas<span class="dot" id="qDot" hidden></span></button>
  <button data-tab="movimientos"><svg viewBox="0 0 24 24"><path d="M6 3.5h9l3.5 3.5v13.5H6z"/><path d="M9 10h6M9 13.5h6M9 17h3.5"/></svg>Movimientos</button>
  <button data-tab="super"><svg viewBox="0 0 24 24"><path d="M3 4h2.5l2.2 11h10l2-8H7"/><circle cx="9" cy="19" r="1.4"/><circle cx="16.5" cy="19" r="1.4"/></svg>Súper</button>
</nav>
<div id="sheet" hidden></div>
<div id="toast" hidden role="status"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
